[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-agent-product-runtime"
version = "0.1.0"
description = "Boss Agent product-side Hermes runtime"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "COMMERCIAL_LICENSE.md", "TRADEMARKS.md", "evidence/T02/inventory/LICENSE", "evidence/T02/inventory/THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.5",
  "bcrypt==5.0.0",
  "croniter==6.2.4",
  "cryptography==50.0.2",
  "filelock==4.2.4",
  "httpx==0.28.1",
  "jsonlines==4.0.0",
  "jsonschema[format]==4.25.1",
  "loguru==0.7.3",
  "markdown-it-py==4.2.0",
  "multidict==7.1.0",
  "nanobot-ai[api]==0.3.5",
  "openpyxl==3.1.5",
  "packaging==26.3",
  "pydantic==2.14.1",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "PyYAML==6.0.3",
  "reportlab==4.4.4",
  "sse-starlette==3.5.0",
  "websockets==16.1.1",
  "yarl==1.25.1",
]

[project.scripts]
boss-agent-runtime = "boss_agent_runtime.boss_agent_runtime_bootstrap:main"

[tool.setuptools]
include-package-data = false
