name: Boss-Agent F01 focused validation

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "validation/**"
      - "scripts/**"
      - "specs/**"
      - ".github/workflows/boss-agent-f01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morning-business:
    name: F01 real domain and persistence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked product and nanobot dependencies
        run: uv sync --project validation --locked
      - name: Create private project-local test directories
        run: mkdir -p .work/ci-pytest .work/ci-tmp
      - name: F01 sorting and original-receipt behavior regression
        run: node --test app/tests/f01_today_order.test.mjs app/tests/f01_return_point.test.mjs app/tests/f01_morning_detail_scope.test.mjs app/tests/f01_morning_assignment_context.test.mjs app/tests/f01_morning_binding_recovery.test.mjs
      - name: F01 native morning agent and fixed-source permission regression
        env:
          FC03_NATIVE_DOMAIN_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/validation:${{ github.workspace }}/validation/fc03_agent:${{ github.workspace }}/app/tests:${{ github.workspace }}/app/tests/fc03_agent
          TMPDIR: ${{ github.workspace }}/.work/ci-tmp
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --project validation --no-sync python -m pytest -q
          --basetemp .work/ci-pytest/f01-agent
          app/tests/fc03_agent/test_formal.py
          app/tests/fc03_agent/test_menu.py
          app/tests/fc03_agent/test_native.py
      - name: Exercise F01 classifications, source versions, CAS and public endpoints
        env:
          PYTHONPATH: ${{ github.workspace }}/validation:${{ github.workspace }}/app/tests
          TMPDIR: ${{ github.workspace }}/.work/ci-tmp
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --project validation --no-sync python -m pytest -q
          --basetemp .work/ci-pytest/f01
          app/tests/test_boss_today.py
          app/tests/test_fc03_morning.py
          app/tests/test_menu_f01_domain.py
          app/tests/test_public_morning.py
          app/tests/test_f01_compiled_bundle.py
