name: Boss-Agent desktop integration
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "validation/**"
      - "scripts/**"
      - ".github/workflows/boss-agent-desktop.yml"
      - "Boss-Agent-Desktop-Complete-v6/meta/**"
      - "specs/hld-72-page-map.json"
  workflow_dispatch:

concurrency:
  group: boss-agent-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-domain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked validation dependencies
        run: uv sync --project validation --locked
      - name: Verify Git excludes credentials
        run: python scripts/check_git_secrets.py
      - name: Python syntax verification
        run: python -m compileall -q validation/boss_page_api.py validation/boss_command_api.py validation/boss_workspace_api.py validation/boss_sector_api.py validation/boss_meeting_approval.py validation/boss_assignment_nudge.py validation/boss_scheduler_config.py validation/boss_knowledge_ingestion.py validation/boss_prompt_config.py validation/boss_task_reminders.py validation/boss_self_commitments.py validation/boss_meeting_brief.py validation/boss_travel.py validation/boss_people.py validation/boss_owner_preferences.py validation/boss_owner_authorizations.py validation/boss_research.py validation/boss_message_calendar.py validation/boss_recovery_api.py validation/safe_diagnostics.py validation/business.py validation/controls.py validation/role_channel.py validation/application.py scripts/prepare_boss_webui.py scripts/configure_local_deepseek.py scripts/check_local_deepseek.py scripts/check_local_boss_agent.py scripts/check_git_secrets.py
      - name: Create isolated test fixture parent directories
        run: mkdir -p .work/ci-pytest
      - name: Current N03 business and public integration contracts
        env:
          MENU_N02_PRODUCT_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/validation:${{ github.workspace }}/app/tests
        run: >-
          uv run --project validation --no-sync python -m pytest -q --basetemp .work/ci-pytest/n03
          app/tests/test_menu_n03_overview.py
          app/tests/test_menu_n03_entry.py
          app/tests/test_menu_n03_preparation.py
          app/tests/test_menu_n03_scoped_preparation.py
          app/tests/test_menu_n03_meeting_preparation.py
          app/tests/test_menu_n03_public.py
          app/tests/test_menu_n03_public_entry.py
          app/tests/test_menu_n03_public_meeting.py
      - name: Scoped role/business tests
        run: uv run --project validation --no-sync python -m pytest -q --basetemp .work/ci-pytest/core app/tests/test_boss_page_api.py app/tests/test_boss_command_api.py app/tests/test_boss_assignment_nudge.py app/tests/test_boss_scheduler_config.py app/tests/test_v6_scheduler_ui.py app/tests/test_boss_workspace_api.py app/tests/test_boss_memory_notifications.py app/tests/test_boss_meeting_approval.py app/tests/test_boss_knowledge_ingestion.py app/tests/test_boss_prompt_context_adoption.py app/tests/test_boss_minutes_assignment_chain.py app/tests/test_boss_task_center.py app/tests/test_boss_self_commitments.py app/tests/test_boss_task_reminders.py app/tests/test_boss_meeting_brief.py app/tests/test_boss_travel.py app/tests/test_boss_people.py app/tests/test_boss_owner_preferences.py app/tests/test_boss_owner_authorizations.py app/tests/test_boss_research.py app/tests/test_boss_fr04_09_full_flow.py app/tests/test_v6_research_ui.py app/tests/test_v6_meeting_brief_ui.py app/tests/test_v6_minutes_approval_ui.py app/tests/test_boss_message_calendar.py app/tests/test_boss_recovery.py app/tests/test_v6_communication_calendar_ui.py app/tests/test_boss_sector_api.py app/tests/test_v6_contract.py app/tests/test_v6_owner_preferences_ui.py app/tests/test_local_deepseek_setup.py app/tests/test_product_privacy.py

  react-webui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned overlay preparation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Build pinned nanobot with v6 React overlay
        run: python scripts/prepare_boss_webui.py --build
      - name: Check compiled bundle
        run: test -f .work/product/nanobot/nanobot/web/dist/index.html
      - name: Verify native patch rebuild is idempotent and sources remain complete
        run: |
          test -f .work/product/boss-native-patches.json
          cp .work/product/boss-native-patches.json .work/product/boss-native-patches-first.json
          python scripts/prepare_boss_webui.py
          cmp .work/product/boss-native-patches.json .work/product/boss-native-patches-first.json
      - name: Verify distributable matches recorded source and content hashes
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path(".work/product")
          info = json.loads((root / "boss-compiled-build.json").read_text())
          assert info["format"] == "BOSS_AGENT_DIST_SHA256_V1"
          assert info["repo_commit"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert info["nanobot_commit"] == "1bb712d3488915ca4ed9ccc1a93067ff722f5ab9"
          assert info["result"] == "BUILT_NOT_MAC_GUI_ACCEPTED"
          assert info["desktop_v7_verified"] is False
          dist = root / "nanobot/nanobot/web/dist"
          actual = {
              str(p.relative_to(dist)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in dist.rglob("*") if p.is_file()
          }
          assert info["assets"] and actual == info["assets"]
          assert actual["index.html"] == info["index_html_sha256"]
          assert hashlib.sha256((root / "boss-build-manifest.json").read_bytes()).hexdigest() == info["overlay_manifest_sha256"]
          print("compiled bundle digest validated", len(actual), "files")
          PY
      - name: Archive immutable F01 integration candidate for manual Mac review
        uses: actions/upload-artifact@v4
        with:
          name: boss-f01-frontend-${{ github.sha }}
          path: |
            .work/product/nanobot/nanobot/web/dist/
            .work/product/boss-compiled-build.json
            .work/product/boss-build-manifest.json
            .work/product/boss-native-patches.json
          retention-days: 14
          if-no-files-found: error
      - name: Syntax check Electron host
        run: node --check validation/desktop/main.cjs
