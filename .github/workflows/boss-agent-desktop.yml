name: Boss-Agent desktop integration
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "validation/**"
      - "scripts/**"
      - ".github/workflows/boss-agent-desktop.yml"
      - "Boss-Agent-Desktop-Complete-v6/meta/**"
      - "specs/hld-72-page-map.json"
  workflow_dispatch:

concurrency:
  group: boss-agent-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-domain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked validation dependencies
        run: uv sync --project validation --locked
      - name: Verify Git excludes credentials
        run: python scripts/check_git_secrets.py
      - name: Python syntax verification
        run: python -m compileall -q validation/boss_page_api.py validation/boss_command_api.py validation/boss_workspace_api.py validation/boss_sector_api.py validation/boss_meeting_approval.py validation/boss_assignment_nudge.py validation/boss_scheduler_config.py validation/boss_knowledge_ingestion.py validation/boss_prompt_config.py validation/boss_task_reminders.py validation/boss_self_commitments.py validation/boss_meeting_brief.py validation/boss_travel.py validation/boss_people.py validation/boss_owner_preferences.py validation/boss_owner_authorizations.py validation/boss_research.py validation/boss_message_calendar.py validation/boss_recovery_api.py validation/safe_diagnostics.py validation/business.py validation/controls.py validation/role_channel.py validation/application.py scripts/prepare_boss_webui.py scripts/configure_local_deepseek.py scripts/check_local_deepseek.py scripts/check_local_boss_agent.py scripts/check_git_secrets.py
      - name: Scoped role/business tests
        run: uv run --project validation --no-sync python -m pytest -q app/tests/test_boss_page_api.py app/tests/test_boss_command_api.py app/tests/test_boss_assignment_nudge.py app/tests/test_boss_scheduler_config.py app/tests/test_v6_scheduler_ui.py app/tests/test_boss_workspace_api.py app/tests/test_boss_memory_notifications.py app/tests/test_boss_meeting_approval.py app/tests/test_boss_knowledge_ingestion.py app/tests/test_boss_prompt_context_adoption.py app/tests/test_boss_minutes_assignment_chain.py app/tests/test_boss_task_center.py app/tests/test_boss_self_commitments.py app/tests/test_boss_task_reminders.py app/tests/test_boss_meeting_brief.py app/tests/test_boss_travel.py app/tests/test_boss_people.py app/tests/test_boss_owner_preferences.py app/tests/test_boss_owner_authorizations.py app/tests/test_boss_research.py app/tests/test_boss_fr04_09_full_flow.py app/tests/test_v6_research_ui.py app/tests/test_v6_meeting_brief_ui.py app/tests/test_v6_minutes_approval_ui.py app/tests/test_boss_message_calendar.py app/tests/test_boss_recovery.py app/tests/test_v6_communication_calendar_ui.py app/tests/test_boss_sector_api.py app/tests/test_v6_contract.py app/tests/test_v6_owner_preferences_ui.py app/tests/test_local_deepseek_setup.py app/tests/test_product_privacy.py

  react-webui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned overlay preparation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Build pinned nanobot with v6 React overlay
        run: python scripts/prepare_boss_webui.py --build
      - name: Check compiled bundle
        run: test -f .work/product/nanobot/nanobot/web/dist/index.html
      - name: Syntax check Electron host
        run: node --check validation/desktop/main.cjs
