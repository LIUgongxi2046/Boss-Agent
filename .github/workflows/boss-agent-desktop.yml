name: Boss-Agent desktop integration
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "validation/**"
      - "scripts/**"
      - ".github/workflows/boss-agent-desktop.yml"
      - "Boss-Agent-Desktop-Complete-v6/meta/**"
      - "specs/hld-72-page-map.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-domain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install pytest==8.4.2 aiohttp==3.14.5 jsonschema==4.25.1
      - name: Verify Git excludes credentials
        run: python scripts/check_git_secrets.py
      - name: Python syntax verification
        run: python -m compileall -q validation/boss_page_api.py validation/boss_command_api.py validation/boss_workspace_api.py validation/boss_sector_api.py validation/boss_meeting_approval.py validation/safe_diagnostics.py validation/business.py validation/controls.py validation/role_channel.py validation/application.py scripts/prepare_boss_webui.py scripts/configure_local_deepseek.py scripts/check_local_deepseek.py scripts/check_local_boss_agent.py scripts/check_git_secrets.py
      - name: Scoped role/business tests
        run: python -m pytest -q app/tests/test_boss_page_api.py app/tests/test_boss_command_api.py app/tests/test_boss_workspace_api.py app/tests/test_boss_memory_notifications.py app/tests/test_boss_meeting_approval.py app/tests/test_boss_sector_api.py app/tests/test_v6_contract.py app/tests/test_local_deepseek_setup.py app/tests/test_product_privacy.py

  react-webui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned nanobot with v6 React overlay
        run: python scripts/prepare_boss_webui.py --build
      - name: Check compiled bundle
        run: test -f .work/product/nanobot/nanobot/web/dist/index.html
      - name: Syntax check Electron host
        run: node --check validation/desktop/main.cjs
