          content:
            application/json:
              schema: {$ref: '../validation/agent_run_resume_schema.json#/$defs/receipt'}
        '400': {description: 请求格式、字段、运行编号或查询参数无效}
        '401': {description: 当前身份无效}
        '403': {description: 请求来源、会话订阅或来源范围无权操作}
        '404': {description: 当前范围没有对应运行}
        '409': {description: 运行状态、版本或原请求内容冲突}
