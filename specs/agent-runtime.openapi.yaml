            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: 恢复回执；当前未启用
          content:
            application/json:
              schema: {$ref: ../validation/agent_run_recovery_schema.json#/$defs/receipt}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
