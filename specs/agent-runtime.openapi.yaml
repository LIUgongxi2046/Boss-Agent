        '400': {description: 运行编号、请求编号或查询参数无效}
        '401': {description: 当前身份无效}
        '403': {description: 请求来源、会话订阅或来源范围无权访问}
        '404': {description: 当前范围没有对应运行或原回执}
        '409': {description: 当前来源或运行范围已经变化}
  /api/v2/runs/{run_id}/source-history/{event_id}:
