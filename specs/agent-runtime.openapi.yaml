      - {name: run_id, in: path, required: true, description: 使用规范小写 UUID 字符串, schema: {type: string, format: uuid}}
      - {name: event_id, in: path, required: true, description: 使用规范小写 UUID 字符串, schema: {type: string, format: uuid}}
      - {name: source_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 160, pattern: '\S'}}
      - {name: version, in: query, required: true, description: 规范 ASCII 十进制文本，最多 32 位, schema: {type: string, pattern: '^(0|[1-9][0-9]{0,31})$'}}
    get:
      operationId: readRunSourceHistory
      description: 本人认证并订阅会话后读取结果所引用的来源版本；核查运行范围、来源状态和摘要。位置状态为 NOT_VERIFIED，本人成功读取尚未验证。Host 与 Origin 按同源规则检查。
      responses:
        '200':
          description: 来源正文、版本、摘要及未经核查的引用位置
          headers:
