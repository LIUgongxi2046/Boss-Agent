      - {name: source_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 160, pattern: '\S'}}
      - {name: version, in: query, required: true, description: 规范 ASCII 十进制正整数文本，最多 16 位, schema: {type: string, pattern: '^[1-9][0-9]{0,15}$'}}
      - {name: artifact_version, in: query, required: true, description: 规范 ASCII 十进制正整数文本，最多 16 位, schema: {type: string, pattern: '^[1-9][0-9]{0,15}$'}}
    get:
