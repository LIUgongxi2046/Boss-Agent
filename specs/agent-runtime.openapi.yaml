        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/skill-candidates/{candidate_id}/publish:
    parameters: *candidateId
    post:
      operationId: publishSkillCandidate
      description: MAINTAINER 发布候选，核查本人授权、摘要和方法依赖；需要匹配的 Origin，成功路径未验证。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillPublicationInput'}
      responses:
        '200':
          description: 方法启用结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillActivationResult'}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/skill-candidates/{candidate_id}/publications/{publication_id}:
    parameters: *candidateOperationId
    get:
      operationId: readSkillPublicationStatus
      description: MAINTAINER 以原 client_request_id 查询发布状态；成功路径未验证。
      responses:
        '200':
          description: 原发布状态和结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillPublicationStatus'}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/skills/disable:
    post:
      operationId: disableSkill
      description: MAINTAINER 停用指定方法；需要匹配的 Origin，成功路径未验证。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillDisableInput'}
      responses:
        '200':
          description: 方法停用结果
          content:
            application/json:
              schema:
                type: object
                required: [sop_id, version, content_sha256, activation_policy, business_authorization_granted, model_adoption_verified]
                properties:
                  sop_id: {type: string}
                  version: {type: string}
                  content_sha256: {type: string}
                  activation_policy: {const: NEXT_CONTEXT_LOAD}
                  business_authorization_granted: {const: false}
                  model_adoption_verified: {const: false}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/skills/recover:
    post:
      operationId: recoverSkillActivation
      description: MAINTAINER 处理 PREPARED 方法启用记录；需要匹配的 Origin，成功路径未验证。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillActivationRecoveryInput'}
      responses:
        '200':
          description: 方法启用结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillActivationResult'}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/skills/cancel:
    post:
      operationId: cancelSkillActivation
      description: MAINTAINER 取消 PREPARED 方法启用记录；需要匹配的 Origin，成功路径未验证。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillActivationRecoveryInput'}
      responses:
        '200':
          description: 方法取消结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillActivationResult'}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
components:
  securitySchemes:
    ProductBearer:
      type: http
      scheme: bearer
      description: 当前产品认证凭据；本人运行还需要有效会话订阅和来源范围。
  schemas:
    PlanBudget:
      type: object
      additionalProperties: false
      required: [model_requests, rounds, tools, seconds, concurrency, context_tokens, files, file_bytes, open_files, cpu_seconds]
      properties:
        model_requests: {type: integer, minimum: 1}
        rounds: {type: integer, minimum: 1}
        tools: {type: integer, minimum: 1}
        seconds: {type: integer, minimum: 1}
        concurrency: {type: integer, minimum: 1}
        context_tokens: {type: integer, minimum: 1}
        files: {type: integer, minimum: 1}
        file_bytes: {type: integer, minimum: 1}
        open_files: {type: integer, minimum: 16}
        cpu_seconds: {type: integer, minimum: 1}
    PlanStopConditions:
      type: object
      additionalProperties: false
      required: [business_until]
      properties:
        business_until: {type: string, format: date-time, description: 需要包含时区的业务结束时间}
    PlanMethodsInput:
      type: object
      additionalProperties: false
      required: [plan_id, expected_version, conversation_id, source_refs]
      properties:
        plan_id: {type: string}
        expected_version: {type: string}
        conversation_id: {type: string}
        source_refs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    PlanMethods:
      type: object
      additionalProperties: false
      required: [plan_id, version, conversation_id, source_refs, methods]
      properties:
        plan_id: {type: string}
        version: {type: string}
        conversation_id: {type: string}
        source_refs: {type: array, items: {type: string}}
        methods: {$ref: './agent-runs.schema.json#/$defs/method_catalog/properties/methods'}
    PlanPreviewInput:
      type: object
      additionalProperties: false
      required: [plan_id, expected_version, conversation_id, source_refs, budget, stop_conditions, required_outputs, method_selection]
      properties:
        plan_id: {type: string}
        expected_version: {type: string}
        conversation_id: {type: string}
        source_refs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1, pattern: '\S'}}
        budget: {$ref: '#/components/schemas/PlanBudget'}
        stop_conditions: {$ref: '#/components/schemas/PlanStopConditions'}
        required_outputs: {$ref: './agent-runs.schema.json#/$defs/required_outputs'}
        method_selection: {$ref: './agent-runs.schema.json#/$defs/method_selection'}
    PlanBindingInput:
      type: object
      additionalProperties: false
      required: [client_request_id, plan_id, expected_version, conversation_id, source_refs, budget, stop_conditions, authorization_id, required_outputs, method_selection]
      properties:
        client_request_id: {type: string}
        plan_id: {type: string}
        expected_version: {type: string}
        conversation_id: {type: string}
        source_refs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1, pattern: '\S'}}
        budget: {$ref: '#/components/schemas/PlanBudget'}
        stop_conditions: {$ref: '#/components/schemas/PlanStopConditions'}
        authorization_id: {type: string}
        required_outputs: {$ref: './agent-runs.schema.json#/$defs/required_outputs'}
        method_selection: {$ref: './agent-runs.schema.json#/$defs/method_selection'}
    PlanDecisionInput:
      type: object
      additionalProperties: false
      required: [preview_id, payload_sha256, decision, client_request_id]
      properties:
        preview_id: {type: string}
        payload_sha256: {type: string}
        decision: {enum: [CONFIRM, REJECT]}
        client_request_id: {type: string, minLength: 8, maxLength: 128}
    PlanPreview:
      type: object
      required: [preview_id, plan_id, expected_version, content_version, action, payload, payload_sha256]
      properties:
        preview_id: {type: string}
        plan_id: {type: string}
        expected_version: {type: string}
        content_version: {type: string}
        action: {const: owner_plan.save}
        payload: {$ref: '#/components/schemas/PlanBoundPayload'}
        payload_sha256: {type: string}
    PlanBoundPayload:
      type: object
      required: [purpose, event_ids, timezone, not_before, event_versions, budget, stop_conditions, conversation_id, source_refs, scope_proof, required_outputs, method_selection]
      properties:
        purpose: {type: string}
        event_ids: {type: array, items: {type: string}}
        timezone: {type: string}
        not_before: {type: string}
        event_versions: {type: object, additionalProperties: {type: string}}
        budget: {$ref: '#/components/schemas/PlanBudget'}
        stop_conditions: {$ref: '#/components/schemas/PlanStopConditions'}
        conversation_id: {type: string}
        source_refs: {type: array, items: {type: string}}
        required_outputs: {$ref: './agent-runs.schema.json#/$defs/required_outputs'}
        method_selection: {$ref: './agent-runs.schema.json#/$defs/method_selection'}
        scope_proof:
          type: object
          required: [namespace, owner_id, dataset_id, dataset_version, chat_id, session_id, native_session_created_at, binding_id, context_version, source_pins]
          properties:
            namespace: {type: string}
            owner_id: {type: string}
            dataset_id: {type: string}
            dataset_version: {type: string}
            chat_id: {type: string}
            session_id: {type: string}
            native_session_created_at: {type: string}
            binding_id: {type: [string, 'null']}
            context_version: {type: [string, 'null']}
            source_pins:
              type: array
              items:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: string}
    PlanDecisionReceipt:
      type: object
      required: [preview_id, decision, authorization_id]
      properties:
        preview_id: {type: string}
        decision: {enum: [CONFIRM, REJECT]}
        authorization_id: {type: [string, 'null']}
    PlanBindingReceipt:
      type: object
      required: [plan_id, version, authorization_id, state]
      properties:
        plan_id: {type: string}
        version: {type: string}
        authorization_id: {type: string}
        state: {type: string}
    LegacyLinkResponse:
      type: object
      required: [run_id, link]
      properties:
        run_id: {type: string}
        link:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [run_id, session_id, engine, source_digest]
              properties:
                run_id: {type: string}
                session_id: {type: string}
                engine: {const: nanobot}
                source_digest: {type: string}
    LegacyLinkCreated:
      type: object
      required: [run_id, session_id, engine, source_digest, created]
      properties:
        run_id: {type: string}
        session_id: {type: string}
        engine: {const: nanobot}
        source_digest: {type: string}
        created: {type: boolean}
    SkillMethodReference:
      type: object
      required: [sop_id, name, version, content_sha256]
      properties:
        sop_id: {type: string}
        name: {type: string}
        version: {type: string}
        content_sha256: {type: string}
    SkillCandidate:
      type: object
      required: [candidate_id, run_id, sop_id, content_sha256, state, enabled, validation_status, created_at]
      properties:
        candidate_id: {type: string}
        run_id: {type: string}
        sop_id: {type: string}
        content_sha256: {type: string}
        state: {type: string}
        enabled: {type: boolean}
        validation_status: {type: string}
        created_at: {type: string}
    SkillCandidatePage:
      type: object
      required: [items, next_after]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SkillCandidate'}}
        next_after: {type: [string, 'null']}
    SkillCandidatePreview:
      type: object
      required: [candidate_id, sop_id, content, content_sha256, base_content, base_method, validation_status, decision_receipts]
      properties:
        candidate_id: {type: string}
        sop_id: {type: string}
        content: {type: string}
        content_sha256: {type: string}
        base_content: {type: string}
        base_method: {$ref: '#/components/schemas/SkillMethodReference'}
        validation_status: {type: string}
        decision_receipts:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/SkillDecision'}
              - type: object
                required: [client_request_id]
                properties:
                  client_request_id: {type: string}
    SkillDecisionInput:
      type: object
      additionalProperties: false
      required: [client_request_id, expected_content_sha256, expected_base_sha256, decision]
      properties:
        client_request_id: {type: string, minLength: 1, maxLength: 128}
        expected_content_sha256: {type: string, minLength: 1, maxLength: 128}
        expected_base_sha256: {type: string, minLength: 1, maxLength: 128}
        decision: {enum: [APPROVE, REJECT]}
    SkillDecision:
      type: object
      required: [candidate_id, sop_id, content_sha256, base_sha256, tool_config_sha256, decision, authorization_id]
      properties:
        candidate_id: {type: string}
        sop_id: {type: string}
        content_sha256: {type: string}
        base_sha256: {type: string}
        tool_config_sha256: {type: [string, 'null']}
        decision: {enum: [APPROVE, REJECT]}
        authorization_id: {type: string}
    SkillDecisionStatus:
      type: object
      required: [candidate_id, client_request_id, state, result]
      properties:
        candidate_id: {type: string}
        client_request_id: {type: string}
        state: {enum: [NOT_FOUND, RECORDED]}
        result:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SkillDecision'}
    SkillCandidateDetail:
      allOf:
        - {$ref: '#/components/schemas/SkillCandidate'}
        - type: object
          required: [base_method, errors, missing_tools, tool_config_sha256, current_active_sha256, draft_version, decisions]
          properties:
            base_method: {$ref: '#/components/schemas/SkillMethodReference'}
            errors: {type: array, items: {type: object}}
            missing_tools: {type: array, items: {type: string}}
            tool_config_sha256: {type: [string, 'null']}
            current_active_sha256: {type: string}
            draft_version: {type: string}
            decisions:
              type: array
              items:
                type: object
                required: [authorization_id, decision, valid_from, valid_until, revoked, expired, content_sha256, base_sha256, tool_config_sha256]
                properties:
                  authorization_id: {type: string}
                  decision: {enum: [APPROVE, REJECT]}
                  valid_from: {type: string}
                  valid_until: {type: string}
                  revoked: {type: boolean}
                  expired: {type: boolean}
                  content_sha256: {type: string}
                  base_sha256: {type: string}
                  tool_config_sha256: {type: [string, 'null']}
    SkillValidation:
      type: object
      required: [candidate_id, content_sha256, method_version, state, enabled, validation_status, errors, missing_tools, tool_config_sha256, model_adoption_verified]
      properties:
        candidate_id: {type: string}
        content_sha256: {type: string}
        method_version: {type: string}
        state: {const: DRAFT}
        enabled: {const: false}
        validation_status: {enum: [INVALID, VALIDATED_STATIC_ONLY]}
        errors: {type: array, items: {type: object}}
        missing_tools: {type: array, items: {type: string}}
        tool_config_sha256: {type: string}
        model_adoption_verified: {const: false}
    SkillPublicationInput:
      type: object
      additionalProperties: false
      required: [client_request_id, expected_content_sha256, expected_base_sha256, expected_draft_version, authorization_id, change_note]
      properties:
        client_request_id: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        expected_content_sha256: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        expected_base_sha256: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        expected_draft_version: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        authorization_id: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        change_note: {type: string, minLength: 1, maxLength: 360, pattern: '\S'}
    SkillPublicationStatus:
      type: object
      required: [candidate_id, client_request_id, state]
      properties:
        candidate_id: {type: string}
        client_request_id: {type: string}
        state: {enum: [NOT_FOUND, PREPARED, COMPLETED, CANCELED]}
        sop_id: {type: string}
        result:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SkillActivationResult'}
    SkillDisableInput:
      type: object
      additionalProperties: false
      required: [client_request_id, sop_id, expected_active_sha256]
      properties:
        client_request_id: {type: string, minLength: 1, maxLength: 128}
        sop_id: {type: string, minLength: 1, maxLength: 128}
        expected_active_sha256: {type: string}
    SkillActivationRecoveryInput:
      type: object
      additionalProperties: false
      required: [client_request_id, sop_id, activation_request_id]
      properties:
        client_request_id: {type: string, minLength: 1, maxLength: 128}
        sop_id: {type: string, minLength: 1, maxLength: 128}
        activation_request_id: {type: string}
    SkillActivationResult:
      type: object
      required: [sop_id, draft_version, state, method_version, content_sha256, model_adoption_verified, business_authorization_granted]
      properties:
        sop_id: {type: string}
        draft_version: {type: string}
        state: {enum: [ACTIVE, CANCELED]}
        method_version: {type: string}
        content_sha256: {type: string}
        model_adoption_verified: {const: false}
        business_authorization_granted: {const: false}
