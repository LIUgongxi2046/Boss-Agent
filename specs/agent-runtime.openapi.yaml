        '400': {description: 编号或查询字段无效}
        '401': {description: 当前身份无效}
        '403': {description: 请求来源、本人会话或来源范围无权访问}
        '404': {description: 运行、结果、引用或历史正文不可读取}
        '409': {description: 当前空间、来源版本、摘要或结果记录不可核查}
        '410': {description: 来源撤销或清理已经开始}
