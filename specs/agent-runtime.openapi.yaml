          content:
            application/json:
              schema: {$ref: '../validation/agent_run_resume_schema.json#/$defs/status'}
        '400': {description: 运行编号或查询参数无效}
        '401': {description: 当前身份无效}
        '403': {description: 请求来源、会话订阅或来源范围无权访问}
        '404': {description: 当前范围没有对应运行}
        '409': {description: 当前来源或运行范围已经变化}
