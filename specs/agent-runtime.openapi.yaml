openapi: 3.1.0
info:
  title: Boss-Agent 本地运行接口
  version: 1.0.0
  description: |
    本规范覆盖同源运行、运行恢复、本人意图、成果读取、结果与成果的来源历史、本人计划执行、历史会话关联及方法候选路由。
    产品入口需要显式配置端口及对应迁移；使用产品本人认证、会话订阅和来源范围检查。
    当前运行创建及意图处理受引擎准备保护；成果读取受工作区隔离保护，相关成功路径未验证。
    方法候选本人决定、维护发布及恢复的成功路径尚未验证。
    不同入口可能返回 JSON 错误或文本错误，具体顺序受来源、身份与字段检查影响。
security:
  - ProductBearer: []
paths:
  /api/v2/owner-plans/{plan_id}/suppressed-history:
    get:
      summary: 读取本人计划事项的抑制历史
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
        - {name: version, in: query, required: true, schema: {type: string}}
        - {name: event_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 已核查的抑制回执列表
          content:
            application/json:
              schema: {$ref: ../validation/agent_schedule_history_schema.json}
        '401': {description: 本人认证无效}
        '403': {description: 会话或来源范围无权读取}
  /api/v2/runs/{run_id}/intent:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: readCurrentIntent
      description: 读取当前本人会话的待确认意图，核查运行租约、所选来源及当前版本；正式运行条件未通过时返回 503。
      responses:
        '200':
          description: 版本化意图预览与当前允许动作
          content:
            application/json:
              schema:
                $ref: ./agent-intents.schema.json#/$defs/preview
        '400': {description: 请求格式无效}
        '401': {description: 当前身份无效}
        '403': {description: 身份或请求来源无权访问}
        '404': {description: 当前范围没有待确认意图}
        '409': {description: 运行、租约或来源版本已经变化}
        '503': {description: 正式运行条件尚未通过}
  /api/v2/intents/{intent_id}/decision:
    parameters:
      - name: intent_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    post:
      operationId: decideIntent
      description: 本人根据当前预览作出决定；请求需要同源 Origin，正式运行条件未通过时返回 503。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./agent-intents.schema.json#/$defs/decision
      responses:
        '200':
          description: 已保存的本人决定回执
          content:
            application/json:
              schema:
                $ref: ./agent-intents.schema.json#/$defs/decision_receipt
        '400': {description: 请求字段无效}
        '401': {description: 当前身份无效}
        '403': {description: 身份或请求来源无权操作}
        '404': {description: 当前范围没有对应意图}
        '409': {description: 版本、来源或请求编号冲突}
        '503': {description: 正式运行条件尚未通过}
  /api/v2/intent-decisions/{request_key}:
    parameters:
      - name: request_key
        in: path
        required: true
        schema:
          $ref: ./agent-intents.schema.json#/$defs/request_key
    get:
      operationId: readIntentDecisionReceipt
      description: 按原请求编号读取当前本人及会话范围内的决定回执；正式运行条件未通过时返回 503。
      responses:
        '200':
          description: 版本化本人决定回执
          content:
            application/json:
              schema:
                $ref: ./agent-intents.schema.json#/$defs/decision_receipt
        '400': {description: 请求编号无效}
        '401': {description: 当前身份无效}
        '403': {description: 身份或请求来源无权访问}
        '404': {description: 当前范围没有原回执}
        '409': {description: 会话或来源版本已经变化}
        '503': {description: 正式运行条件尚未通过}
  /api/v2/requests/{request_key}:
    parameters:
      - name: request_key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: readOriginalRequest
      responses:
        '200':
          description: 当前身份及资料范围内已保存的原请求回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/request_receipt
        '400': &errorResponse
          description: 认证、范围、字段或版本错误；部分底层错误返回文本，具体状态及格式取决于处理入口。
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/error
            text/plain:
              schema: {type: string}
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/run-method-catalog:
    post:
      operationId: listCreateRunMethods
      description: 需要本人身份、当前会话订阅及匹配来源；返回创建运行时可显式选择的方法。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversation_id, selected_refs]
              properties:
                conversation_id: {$ref: './agent-runs.schema.json#/$defs/key'}
                selected_refs: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: './agent-runs.schema.json#/$defs/key'}}
      responses:
        '200':
          description: 当前会话和来源可使用的方法目录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [conversation_id, selected_refs, methods]
                properties:
                  conversation_id: {type: string}
                  selected_refs: {type: array, items: {type: string}}
                  methods: {$ref: './agent-runs.schema.json#/$defs/method_catalog/properties/methods'}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs:
    post:
      operationId: createRun
      description: 产品创建需要本人明确选择方法，提交 method_selection；当前运行安全条件尚未通过，创建准入保持关闭。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./agent-runs.schema.json#/$defs/create
      responses:
        '200':
          description: 创建或读取原接收回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '409': *errorResponse
        '413': *errorResponse
        '503':
          description: 创建事务前因运行安全条件拒绝时返回 CREATE_NOT_ADMITTED；其他依赖不可用错误不证明原请求结果，需保留请求编号并查询原回执。
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/error
            text/plain:
              schema: {type: string}
  /api/v2/runs/{run_id}:
    parameters: &runId
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: readRun
      description: 读取当前运行快照；可选的 waiting_input 关联当前目标版本和 INPUT_REQUIRED 事件，可选的 method_selection 记录当前目标方法。
      responses:
        '200':
          description: 当前运行投影
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/snapshot
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/dispatch:
    parameters: *runId
    post:
      operationId: dispatchRun
      description: 需要本人有效身份及当前会话订阅。服务端核查来源、预算、租约和隔离条件；执行工厂或安全条件未准备时拒绝。请求等待执行返回；连接中断后应查询原回执，404 不证明请求没有提交。自动派发及本人成功路径尚未验证。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, request_key]
              properties:
                expected_revision: {type: integer, minimum: 0}
                request_key: {$ref: ./agent-runs.schema.json#/$defs/key}
      responses:
        '200':
          description: 原派发请求回执
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run_id, request_key, expected_revision, lease_epoch, state, result]
                properties:
                  run_id: {$ref: ./agent-runs.schema.json#/$defs/key}
                  request_key: {$ref: ./agent-runs.schema.json#/$defs/key}
                  expected_revision: {type: integer, minimum: 0}
                  lease_epoch: {type: integer, minimum: 1}
                  state: {enum: [ACCEPTED, COMPLETED, UNKNOWN]}
                  result: {type: [object, 'null']}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/dispatch-requests/{request_key}:
    parameters:
      - {name: run_id, in: path, required: true, schema: {type: string}}
      - {name: request_key, in: path, required: true, schema: {type: string}}
    get:
      operationId: readDispatchReceipt
      description: 查询原派发请求；UNKNOWN 和在途请求需要核查运行租约与进程记录，不能自动重复派发。
      responses:
        '200':
          description: 原派发请求回执
          content:
            application/json:
              schema:
                type: object
                required: [run_id, request_key, expected_revision, lease_epoch, state, result]
                properties:
                  run_id: {type: string}
                  request_key: {type: string}
                  expected_revision: {type: integer, minimum: 0}
                  lease_epoch: {type: integer, minimum: 1}
                  state: {enum: [ACCEPTED, COMPLETED, UNKNOWN]}
                  result: {type: [object, 'null']}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/dispatch-requests/{request_key}/inspection:
    parameters:
      - {name: run_id, in: path, required: true, schema: {type: string}}
      - {name: request_key, in: path, required: true, schema: {type: string}}
    get:
      operationId: inspectDispatchRecovery
      description: 本人会话只读核查原派发回执、租约、并发预留及进程记录；不能据此自动重复派发。
      responses:
        '200':
          description: 派发原请求的核查结果
          content:
            application/json:
              schema:
                type: object
                required: [run_id, request_key, receipt_state, run_status, lease_epoch, current_lease_epoch, lease_owner_matches, lease_expires_at, reservation_state, process_state, exit_code, exit_scope, automatic_retry]
                properties:
                  run_id: {type: string}
                  request_key: {type: string}
                  receipt_state: {enum: [ACCEPTED, COMPLETED, UNKNOWN]}
                  run_status: {type: string}
                  lease_epoch: {type: integer}
                  current_lease_epoch: {type: integer}
                  lease_owner_matches: {type: boolean}
                  lease_expires_at: {type: [string, 'null']}
                  reservation_state: {type: string}
                  process_state: {type: string}
                  exit_code: {type: [integer, 'null']}
                  exit_scope: {type: [string, 'null']}
                  automatic_retry: {const: false}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/inputs:
    parameters: *runId
    post:
      operationId: addRunInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./agent-runs.schema.json#/$defs/inputs
      responses:
        '200':
          description: 输入回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/input_receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '413': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/object-scope:
    parameters: *runId
    post:
      operationId: bindRunObjectScope
      description: 本人在当前运行和目标版本明确选择对象；服务核查身份、会话、来源、记忆、对象版本和摘要。首次选择要求 QUEUED 或 WAITING_INPUT，运行中仅可核查相同原请求；服务未装配时返回 503。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./agent-runs.schema.json#/$defs/object_scope_request
      responses:
        '200':
          description: 当前目标的明确对象选择回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/object_scope_receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '413': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/object-scope/candidates:
    parameters: *runId
    get:
      operationId: listRunObjectCandidates
      description: 读取当前本人运行来源范围内可核查的五类对象及选择允许状态、不可用原因；需要有效本人会话和订阅。服务按对象来源筛选，查询参数不受支持。
      responses:
        '200':
          description: 当前本人和运行来源范围内的业务对象候选
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/object_scope_candidates
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/object-scope/meeting-candidates/{meeting_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: meeting_id
        in: path
        required: true
        schema:
          $ref: ./agent-runs.schema.json#/$defs/key
    get:
      operationId: readRunMeetingScopeCandidate
      description: 按明确会议编号读取会议上下文候选及选择允许状态，核查会议、关联成员及来源；该候选仍需本人选择。查询参数不受支持。
      responses:
        '200':
          description: 当前会议及关联成员的完整候选，等待本人明确选择
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/object_scope_candidates
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/object-scope/requests/{request_key}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: request_key
        in: path
        required: true
        schema:
          $ref: ./agent-runs.schema.json#/$defs/key
    get:
      operationId: readRunObjectSelectionReceipt
      description: 按原请求编号读取回执，并重新核查当前身份、会话、来源、记忆和对象版本。查询参数不受支持。
      responses:
        '200':
          description: 重新核查后的对象选择回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/object_scope_receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/available-methods:
    parameters: *runId
    get:
      operationId: listRunMethods
      description: 本人会话、订阅、来源和记忆范围核查后读取当前方法目录；selection_allowed 表示当前运行是否允许选择，方法状态及缺少依赖分别列出。查询参数不受支持。
      responses:
        '200':
          description: 当前运行可核查的方法目录
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/method_catalog
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/method-selection:
    parameters: *runId
    post:
      operationId: reselectRunMethod
      description: 本人为补充后的当前目标选择方法；核查目标版本、运行状态、初始方法、方法版本及依赖。请求编号和内容相同的已保存请求可返回原回执；结果未知时查询原回执。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./agent-runs.schema.json#/$defs/method_reselection
      responses:
        '200':
          description: 当前目标的方法选择回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/method_reselection_receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '413': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/method-selection/requests/{request_key}:
    parameters:
      - {name: run_id, in: path, required: true, schema: {type: string}}
      - {name: request_key, in: path, required: true, schema: {type: string}}
    get:
      operationId: readRunMethodSelectionReceipt
      description: 按原请求编号读取已保存的方法选择回执；核查当前本人会话、订阅、来源和记忆范围，查询参数不受支持。
      responses:
        '200':
          description: 原方法选择回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/method_reselection_receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/cancel:
    parameters: *runId
    post:
      operationId: cancelRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./agent-runs.schema.json#/$defs/cancel
      responses:
        '200':
          description: 取消请求回执
          content:
            application/json:
              schema:
                $ref: ./agent-runs.schema.json#/$defs/receipt
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '413': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/events:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: after_seq
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]{1,18}$'
    get:
      operationId: readRunEvents
      responses:
        '200':
          description: 有序事件页面
          content:
            application/json:
              schema:
                $ref: ./agent-events.schema.json#/$defs/page
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/result:
    parameters: *runId
    get:
      operationId: readRunResult
      description: 读取当前目标版本的结果事件；空结果表示该版本尚无已保存结果。
      responses:
        '200':
          description: 当前目标版本及结果事件
          content:
            application/json:
              schema: {$ref: ./agent-events.schema.json#/$defs/result}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/usage:
    parameters: *runId
    get:
      operationId: readRunUsage
      description: 全运行关系授权和后代范围检查尚未验证，认证成功后返回 503，不开放用量查询。
      responses:
        '200':
          description: 最新累计用量快照
          content:
            application/json:
              schema: {$ref: ./agent-runs.schema.json#/$defs/usage_snapshot}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/completion-inspection:
    parameters: *runId
    get:
      operationId: readRunCompletionInspection
      description: 读取已保存的完成核查状态和阻断项；不创建核查、不改变运行状态。版本或目标已变化时返回 stale=true。
      parameters:
        - name: finish_event_id
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: 已保存的完成核查投影
          content:
            application/json:
              schema: {$ref: ./agent-runs.schema.json#/$defs/completion_inspection}
        '400': *errorResponse
        '401': *errorResponse
        '403': *errorResponse
        '404': *errorResponse
        '409': *errorResponse
        '503': *errorResponse
  /api/v2/runs/{run_id}/recover-expired:
    parameters: *runId
    post:
      operationId: recoverExpiredRun
      description: 明确的本人恢复入口；当前身份、来源与写入事务竞争尚未验证，认证成功后返回 503，不执行恢复。
