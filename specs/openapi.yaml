x-simulation-access:
  state: DOMAIN_IMPLEMENTED_PUBLIC_PENDING_W3
  dispatch: SimulationAPI uses interface_id for each x-simulation-operations entry; existing business readers remain available
  query: GET /api/boss/ui/simulation-query -> SimulationAPI.query_http(role,query_string)
  inspect: GET /api/boss/ui/simulation-inspect -> SimulationAPI.inspect_http(role,query_string)
  schema: simulation-query.schema.json
  current_space: 服务端在同一只读事务要求唯一active空间；owner和数据集来自该空间，客户端不能指定。
  filters: SI07/SI08支持完整期间、region_id、product_ids、legal_entity_id、customer_id、CNY和source_version；SI09/SI10支持material_id、asset_owner_id、ownership_type、product_ids、legal_entity_id、customer_id、batch_id、currency和自身source_version；SI13支持source_version；其他接口只支持object_ids，额外筛选400。
  http_query: interface_id必需；object_ids与product_ids采用重复参数表示数组，其余字段仅允许一个值；拒绝未知和空参数，超过4096字节返回414。直接领域调用使用Query对象，HTTP使用锁定nanobot现有GET读取通道。
  object_selection: object_ids匹配业务ID、存储ID或entity_type与冒号及相应ID；object_id保存业务ID，storage_id保存资源存储键，record_id为entity_type与冒号及业务ID。空object_ids读取该接口当前获准范围；最多100项ID，候选或结果超过1000项返回413，不截断候选后返回不完整结果。
  read_semantics: STORED_RECORD表示已保存事实或快照；business_authorization_granted始终false，业务确认和当前采用继续由正式领域动作检查。引用失效、版本或摘要变化、删除与撤销使data为null，并返回当前元信息及缺少说明。
  cached_context: 会议、会面、行程与会议草稿使用现有领域核查当前上下文；现有领域核查范围外的历史缓存要求重新复核。旧查询必须具有实际来源和明细绑定。
  side_effects: 查询不写入业务、审计、授权、回执或Runtime记录，不执行模型、外部检索或调度，不新增model tool_scope。
  policy: BOSS读取本人获准正文；MAINTAINER人工检查使用独立技术元信息投影，不借用BOSS身份；模拟写入仅允许当前已授权资料。
  missing_materials: 不通过默认记录、空值替零、预设专业结论或标签答案填补。
x-runtime-operations:
  - operationId: runtimeMessageSubmit
    role: BOSS
    transport: authenticated nanobot WebSocket
    input:
      type: object
      required: [type, chat_id, content]
      properties: {type: {const: message}, chat_id: {type: string}, content: {type: string, minLength: 1}, media: {type: array, items: {type: string}}}
    output: runtime-events.schema.json Message/Delta/StreamEnd/TurnEnd
    source: nanobot/webui/inbound_commands.py dispatch/_dispatch_message
    adoption: 当前服务端角色、空间、资料和配置；模型文字不能产生额外业务权限。
    timeout: provider 120 seconds per request; total task budget pending W2
  - operationId: runtimeTurnCancel
    role: BOSS
    transport: authenticated nanobot WebSocket
    input:
      type: object
      required: [type, chat_id, content]
      additionalProperties: false
      properties: {type: {const: message}, chat_id: {type: string}, content: {const: /stop}}
    output: 上游消息与turn结束状态；业务动作通过原请求回执和正式对象另行查询。
    source: nanobot/command/builtin.py cmd_stop and nanobot/agent/loop.py _cancel_active_tasks
    scope: 指定chat会话内的当前活动任务与等待队列；当前没有按单个业务run_id撤销已提交结果的接口。
    safety: 取消仅停止未执行步骤，已提交的SQLite业务动作继续存在，禁止重复发送。
    validation: SOURCE_INSPECTED_REAL_RUNTIME_TEST_PENDING_W2
  - operationId: runtimeThreadRead
    role: BOSS
    transport: authenticated nanobot HTTP
    path: /api/sessions/{session_key}/webui-thread
    input: 服务端校验当前会话访问权限的session_key
    output: 上游持久turn和会话投影；敏感正文仅本人可见。
    recovery: 断线或取消后重读持久turn，业务写入另查client_request_id。
    validation: T02_SOURCE_REFERENCE_PRODUCT_RECHECK_PENDING_W2_W3
