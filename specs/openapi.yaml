openapi: 3.1.0
info:
  title: Boss-Agent W1 领域接口接收规范
  version: 1.8.0
  description: 当前HTTP读取、58项基线命令、13项W1领域动作、5项工具与14类模拟资料接口；包含明确SIMULATED的采购库存与生产质量导入、查询和本人协调，公开集成与正式验收分别记录。
security:
  - bearerAuth: []
x-acceptance: NOT_RUN
x-integration: W3_PRIOR_DOMAINS_INTEGRATED_CURRENT_SCHEMA_RECHECK_PENDING
x-command-transport: authenticated nanobot WebSocket webui_request
x-fc02-bi-query:
  scenario_catalog: BIScenarioAPI.catalog(MAINTAINER)
  scenario_load: BIScenarioAPI.execute(MAINTAINER, boss.simulation.bi_scenario.load, payload)
  scenario_receipt: BIScenarioAPI.receipt(MAINTAINER, client_request_id)
  scenario_input_schema: bi-scenario-input.schema.json#/$defs/Load
  scenario_result_schema: bi-scenario-input.schema.json#/$defs/LoadResult
  scenario_record_schema: bi-scenario-input.schema.json#/$defs/Record
  scenario_parameters: bi-scenarios.json; FC02-BI-1; seed=20261024; six explicit reproducible scenarios
  scenario_query: scoped_query_input.scenario_id and optional source_ids; dimensions(BOSS, scenario_id); baseline selection/1 unchanged
  scenario_provenance: SIMULATED_GENERATOR; USER_AUTHORIZED_FC02_BEHAVIOR_VALIDATION; no real enterprise data or third-party authorization claim
  scenario_public_integration: PENDING_N3
  schema_extension: bi-query.schema.json
  assembled_schema: business.SPEC.io_schema
  query: Store.invoke(query_metrics, scoped_query_input) / BIQueryAPI.query(BOSS, payload)
  follow_up: BIQueryAPI.follow_up(BOSS, bi_follow_up)
  current: BIQueryAPI.read(BOSS, query_id, historical=false) -> bi_read
  history: BIQueryAPI.read(BOSS, query_id, historical=true) -> bi_read
  receipt: BIQueryAPI.receipt(BOSS, session_id, request_id) -> bi_receipt
  dimensions: BIQueryAPI.dimensions(BOSS)
  public_integration: PENDING_N3
  context: authenticated server supplies envelope; follow-up inherits persisted parent context and overrides only explicit scope fields
  idempotency: namespace/session_id/request_id plus exact payload digest; concurrent requests persist one query
  stale_history: historical values and original source version remain; no stale source body returned; current adoption requires requery
x-operation-defaults:
  version: 1.8.0
  idempotency: execution_namespace/action/client_request_id with complete payload digest
  concurrency: BEGIN IMMEDIATE plus current object version CAS
  timeout: SQLite connection 10 seconds; external DeepSeek 120 seconds
  retry: no automatic business write retry; original receipt lookup first
  error_response: '#/components/responses/Error'
  audit: role/action/object/authorization/version/time metadata only
  scope: server-injected owner/dataset/version/namespace; contact IDs never authenticate
  rate_limit: NOT_MEASURED; no invented production threshold
  receipt_policy: 已提交业务结果在模型或界面后续失败后保持；取消只停止尚未执行动作。
x-revocation-policy:
  implementation: boss_owner_authorizations.authorization_can_revoke
  continuing_use_actions: [memory.confirm, owner_goals.confirm, owner_notice.confirm, owner_plan.save, owner_plan.resume, calendar.share]
  confirmation_window: 原确认窗口到期后仍允许本人停止持续采用；当前对象状态、业务期限和已撤销状态继续有效。
  single_action_policy: 一次性授权到期后不再接受新提交，不以撤销改写已执行结果。
  projection_adoption: W3在授权列表can_revoke采用同一服务规则；维护身份不能撤销本人确认。
  memory_adoption: Store.context通过当前记忆及前置确认版本识别唯一授权；已撤销确认不进入新上下文。
x-source-policy:
  policy_provider: W2 validation/boss_source_policy.py
  policy_source_commit: 224fbe00b03df312791856f3e76850cd55baa848
  policy_sha256: 6565c180348dc23f60c80e9b4947ab4e46c1e4a83a0fd0ee22d2d1bd0d681896
  current_access_validator: boss_source_access.require_current_simulated_source
  current_business_access_validator: boss_source_access.require_current_business_source
  external_adoption: 原文有效性与外部记录采用分别核查；传递来源变化后需要明确重新导入当前记录，来源确认不直接恢复采用资格。
  effective_clock: objects/clock/current.at
  usable_state: VALID
  states: [RECEIVED, VALID, INCOMPLETE, CONFLICTED, SUPERSEDED, WITHDRAWN, EXPIRED]
  unavailable: 410 for withdrawn or expired; 409 for other noncurrent states; 403 for owner or type mismatch
  query_binding: query_source_binding pins owner/dataset/source version and complete document/detail SHA256
  evidence_read: metadata or version change requires a new query; no silent use of a later document through an earlier query
  legacy_queries: missing query_source_binding returns 409 and requires explicit requery
  receipt_compatibility: committed business receipts remain readable; no business action replay
  assignment_binding: initial assignment_source_binding pins creation-time source versions and full SHA256; explicit owner review archives the known binding and confirms current source adoption without changing business status
  assignment_execution: Store.create_assignment and Store.send_assignment check current source and coordinator validity; completion rechecks the binding in the same transaction
  legacy_assignments: missing complete binding or task source_versions requires explicit owner review; AssignmentSourcesAPI preserves known bindings and confirms current materials without inferring unknown history
  feedback_binding: new feedback pins submitted evidence versions, full SHA256 and source states; completion rechecks the submitted evidence independently of task creation sources
  legacy_feedback: missing complete evidence binding returns 409 before completion and requires a fresh explicit result submission
  historical_feedback: canceled tasks keep late evidence as historical only, including expired evidence metadata; source identity, owner and type remain mandatory
x-tool-authorization-policy:
  implementation: Store.require_current_authorization
  validation: owner, namespace, BOSS issuer, action, target, content version, exact payload, revocation and complete wall-clock authorization window
  single_use: one create authorization produces one task even with concurrent different request keys; one send authorization produces one outbox result
  committed_receipts: original request and content remain readable after revocation without performing another action
  tool_read_projection: read_assignment returns declared read_output fields while preserving additional server-side task metadata
paths:
  /api/boss/ui/supply-quality:
    get:
      operationId: supplyQualityRead
      x-role: BOSS
      x-implementation: boss_supply_quality.SupplyQualityAPI.read_http
      x-integration: PENDING_W3
      description: 当前空间的采购库存计算或批次关系、专业状态与协调任务；SIMULATED来源明确，全部读取在同一事务完成。
      parameters:
        - {name: interface_id, in: query, required: true, schema: {enum: [SI09, SI10]}}
      responses:
        '200': {description: 当前有效记录、来源采用状态、缺少字段和只读计算。, content: {application/json: {schema: {$ref: './supply-quality-results.schema.json#/$defs/Projection'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/supply-quality-receipt:
    get:
      operationId: supplyQualityReceipt
      x-role: ACTION_ROLE
      x-implementation: boss_supply_quality.SupplyQualityAPI.receipt_http
      x-integration: PENDING_W3
      description: 按原动作身份读取当前空间回执；失败和超时保留原结果，不执行重试。
      parameters:
        - {name: action, in: query, required: true, schema: {enum: [boss.simulation.supply_quality.import, boss.simulation.supply_quality.withdraw, boss.supply_quality.coordinate]}}
        - {name: client_request_id, in: query, required: true, schema: {$ref: './simulated-supply-quality.schema.json#/$defs/ClientId'}}
      responses:
        '200': {description: 原请求记录或当前空间没有记录；未知执行结果继续要求核查。, content: {application/json: {schema: {$ref: './supply-quality-results.schema.json#/$defs/Receipt'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/simulation-query:
    get:
      operationId: simulationQuery
      x-role: BOSS
      x-implementation: boss_simulation_api.SimulationAPI.query_http
      x-integration: PENDING_W3
      description: 只读查询当前有效空间的十四类获准模拟资料；正文与缓存逐次检查，不签发业务授权。
      x-query-length-limit: 4096 UTF-8 bytes
      parameters: &simulationQueryParameters
        - {name: interface_id, in: query, required: true, schema: {$ref: './simulation-query.schema.json#/$defs/Interface'}}
        - {name: object_ids, in: query, style: form, explode: true, schema: {$ref: './simulation-query.schema.json#/$defs/Query/properties/object_ids'}}
        - {name: period_start, in: query, schema: {type: string, format: date}}
        - {name: period_end, in: query, schema: {type: string, format: date}}
        - {name: region_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: product_ids, in: query, style: form, explode: true, schema: {$ref: './simulation-query.schema.json#/$defs/Query/properties/filters/properties/product_ids'}}
        - {name: legal_entity_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: customer_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: material_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: asset_owner_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: cost_owner_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: ownership_type, in: query, schema: {enum: [COMPANY, CUSTOMER, COOPERATION]}}
        - {name: batch_id, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: purpose, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: stage, in: query, schema: {$ref: './simulation-query.schema.json#/$defs/Identifier'}}
        - {name: currency, in: query, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {name: source_version, in: query, schema: {$ref: '#/components/schemas/Version'}}
      responses:
        '200': {description: 当前资料、存储状态、来源有效性及缺少范围；availability不表示业务完成。, content: {application/json: {schema: {$ref: './simulation-query.schema.json#/$defs/Result'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/simulation-inspect:
    get:
      operationId: simulationInspect
      x-role: MAINTAINER
      x-implementation: boss_simulation_api.SimulationAPI.inspect_http
      x-integration: PENDING_W3
      description: 独立技术检查，仅返回对象标识、类型、版本和状态；data始终为null，不读取或返回私人正文。
      x-query-length-limit: 4096 UTF-8 bytes
      parameters: *simulationQueryParameters
      responses:
        '200': {description: TECHNICAL_METADATA投影，sources与每项source_refs为空。, content: {application/json: {schema: {$ref: './simulation-query.schema.json#/$defs/Result'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/assignment-source-review:
    get:
      operationId: assignmentSourcesRead
      x-role: BOSS
      x-implementation: boss_assignment_sources.AssignmentSourcesAPI.read
      x-integration: PENDING_W3
      x-scope-policy: 仅接受task_id单项查询；拒绝额外或重复参数，namespace及owner由服务端确定。
      parameters:
        - {name: task_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200': {description: 当前交办、当前来源与实际已知绑定历史；无权或失效来源没有原文片段。, content: {application/json: {schema: {$ref: './assignment-source-review.schema.json#/$defs/Projection'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/runtime-records:
    get:
      operationId: runtimeRecordsRead
      x-role: [BOSS, MAINTAINER]
      x-implementation: boss_runtime_records.runtime_records / runtime_records_query.read_runtime_records
      x-input-schema: runtime-records.schema.json#/$defs/RuntimeRecordsQuery
      x-query-policy: 单独run_id执行单项读取；组合参数执行列表筛选；拒绝未知、重复或空参数，游标两字段须同时提供，started_from不得晚于started_until。
      x-scope-policy: 当前已认证身份与服务端namespace；客户端不得提供owner、namespace或私人正文范围；结果只含技术元信息。
      x-pagination: 先在全部当前空间记录筛选，再按started_at和run_id倒序分页；matched_count为筛选总数，游标保留相同筛选条件。
      x-effect: 只读事务；不重新调用模型或Tool，不修改业务对象。
      parameters:
        - {name: run_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: provider, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: dataset_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: status, in: query, schema: {enum: [QUEUED, RUNNING, WAITING_INPUT, SUCCEEDED, FAILED, CANCELED, TIMED_OUT]}}
        - {name: stop_reason, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: started_from, in: query, schema: {type: string, format: date-time}}
        - {name: started_until, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: string, pattern: '^(?:[1-9][0-9]?|100)$', default: '50'}}
        - {name: cursor_started_at, in: query, schema: {type: string, format: date-time}}
        - {name: cursor_run_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: 实际运行、配置/来源/工具版本、业务结果引用和已观察用量；没有私人正文。
          content: {application/json: {schema: {$ref: './runtime-records.schema.json#/$defs/RuntimeRecordsProjection'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/identity:
    get:
      operationId: bossIdentityRead
      x-role: [BOSS, MAINTAINER]
      responses:
        '200':
          description: 已认证身份；联系人字段不能提供身份
          content:
            application/json:
              schema:
                type: object
                required: [role, owner_id]
                properties: {role: {enum: [BOSS, MAINTAINER]}, owner_id: {type: [string, 'null']}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/dashboard:
    get:
      operationId: bossDashboardRead
      x-role: BOSS
      responses:
        '200':
          description: 当前获准资料、目标、任务、会议与通知
          content: {application/json: {schema: {type: object, required: [source_type, namespace, dataset_id, dataset_version, business_clock, profile, tasks, meeting, notifications], x-data-entities: [owner_goals, task, meeting, notification]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/tasks:
    get:
      operationId: bossTasksRead
      x-role: BOSS
      responses:
        '200':
          description: 当前任务、反馈、关联消息、本人承诺与来源
          content: {application/json: {schema: {type: object, x-data-entities: [task, feedback, outbox, self_commitment]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/meetings:
    get:
      operationId: bossMeetingsRead
      x-role: BOSS
      responses:
        '200':
          description: 当前获准会议与来源元信息
          content: {application/json: {schema: {type: object, required: [source_type, meeting, documents, read_at], x-data-entities: [meeting, document]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/evidence:
    get:
      operationId: bossEvidenceRead
      x-role: BOSS
      parameters:
        - {name: source, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        '200':
          description: 当前范围内未撤销的原始资料
          content: {application/json: {schema: {type: object, required: [source_type, source_id, version, content, read_at], x-data-entities: [document]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/metrics:
    get:
      operationId: bossMetricsRead
      x-role: BOSS
      parameters:
        - {name: products, in: query, required: false, schema: {type: string}, description: 当前支持product-1和product-2，以逗号分隔；改变维度重新运行query_metrics}
      responses:
        '200':
          description: 当前获准明细的确定性计算和来源
          content: {application/json: {schema: {type: object, required: [source_type, result, read_at], properties: {result: {$ref: '#/components/schemas/QueryResult'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/workspace/{projection}:
    get:
      operationId: bossWorkspaceRead
      x-role: PROJECTION_ALLOWLIST
      parameters:
        - name: projection
          in: path
          required: true
          schema: {enum: [memory, calendar, notifications, authorizations, decisions, outbox, sources, knowledge, organization, plans, voice, minutes, approvals, briefing, research, travel, people, owner-goals, owner-notice, dataset, source-index, tool-catalog, metric-definitions, relationships, scheduler, audit, system, evaluation, approval-admin, message-admin, prompt-versions]}
      x-boss-projections: [memory, calendar, notifications, authorizations, decisions, outbox, sources, knowledge, organization, plans, voice, minutes, approvals, briefing, research, travel, people, owner-goals, owner-notice]
      x-maintainer-projections: [dataset, source-index, tool-catalog, metric-definitions, relationships, scheduler, audit, system, evaluation, approval-admin, message-admin, prompt-versions]
      responses:
        '200':
          description: 按当前身份和白名单读取投影；维护正文访问拒绝
          content: {application/json: {schema: {type: object, required: [read_at, source_type, namespace, data_version, projection], properties: {read_at: {type: string, format: date-time}, source_type: {const: SIMULATED}, namespace: {type: string}, data_version: {$ref: '#/components/schemas/Version'}, projection: {type: string}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/operation-status:
    get:
      operationId: bossOperationStatusRead
      x-role: ORIGINAL_ACTION_ROLE
      parameters:
        - {name: action, in: query, required: true, schema: {type: string}}
        - {name: client_request_id, in: query, required: true, schema: {$ref: '#/components/schemas/RequestID'}}
      responses:
        '200':
          description: 原请求回执只读查询；没有记录不能证明动作没有发生
          content: {application/json: {schema: {type: object, required: [action, client_request_id, outcome, write_performed_by_lookup], properties: {action: {type: string}, client_request_id: {type: string}, outcome: {enum: [RECORDED, NOT_FOUND_IN_CURRENT_STORE]}, result: {type: object}, write_performed_by_lookup: {const: false}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/calendar-share-preview:
    get:
      operationId: bossCalendarSharePreview
      x-role: BOSS
      parameters:
        - {name: share_id, in: query, required: true, schema: {type: string, pattern: '^busy-share-', maxLength: 100}}
      responses:
        '200':
          description: 有效授权下的busy-only内容预览；没有外部访问能力
          content: {application/json: {schema: {type: object, required: [share_id, share_status, recipient_id, fields, busy, starts_at, ends_at, timezone, external_delivery_created], x-data-entities: [calendar_share]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/calendar-conflict:
    get:
      operationId: bossCalendarConflictRead
      x-role: BOSS
      parameters:
        - {name: starts_at, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: ends_at, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: timezone, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 使用当前会议版本与已知完整时间检查范围；结束未知时显示限制，取消或举行后的会议不占用当前安排
          content: {application/json: {schema: {type: object, required: [source_type, calendar_id, meeting_id, meeting_version, read_only, read_at]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/sector:
    get:
      operationId: bossSectorRead
      x-role: BOSS
      parameters:
        - {name: page, in: query, required: true, schema: {enum: [F14, F15, F16, F17, F18, F19, F20, F21, F22, F23, V19-BEEF, V19-EGG, V19-MILK]}}
      responses:
        '200':
          description: 当前专题资料覆盖和明确未知指标；完整计算由W2接入获准来源
          content: {application/json: {schema: {type: object, x-data-entities: [agriculture_batch, agriculture_observation, exchange_rate, experiment]}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/model-health:
    get:
      operationId: bossModelHealthRead
      x-role: BOSS
      responses:
        '200': {description: 当前模型连接的安全元信息，不提供凭据, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/model-usage:
    get:
      operationId: maintainerModelUsageRead
      x-role: MAINTAINER
      responses:
        '200': {description: 真实用量和价格覆盖；未知总额保持null, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/maintenance:
    get:
      operationId: maintainerStatusRead
      x-role: MAINTAINER
      responses:
        '200': {description: 维护可见配置与状态元信息, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/owner-plans:
    get:
      operationId: ownerPlansRead
      x-role: BOSS
      responses:
        '200':
          description: 当前本人计划、事件、内部通知与技术执行责任
          content:
            application/json:
              schema:
                type: object
                required: [plans, events, results, dispatches, technical_schedule, execution_owner]
                properties:
                  plans: {type: array, items: {$ref: '#/components/schemas/OwnerPlan'}}
                  events: {type: array, items: {type: object}}
                  results: {type: array, items: {type: object}}
                  dispatches: {type: array, items: {type: object}}
                  technical_schedule: {type: object}
                  execution_owner: {const: CronService}
        default: {$ref: '#/components/responses/Error'}
  /api/boss/ui/today:
    get:
      operationId: todayRead
      x-role: BOSS
      responses:
        '200':
          description: 当前事项及来源版本、分类理由、覆盖缺口与本人次序
          content:
            application/json:
              schema:
